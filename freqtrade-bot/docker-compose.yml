---
services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    container_name: freqtrade_vn_bot
    volumes:
      - "./user_data:/freqtrade/user_data"
    # Mở cổng 8080 cho Ứng dụng Android (FreqBot VN Remote) & Web Dashboard Tiếng Việt kết nối
    # Lưu ý bảo mật: Khi chạy trên VPS thực tế có cài Tailscale, hãy đổi thành "100.x.y.z:8080:8080"
    ports:
      - "127.0.0.1:8080:8080"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.dryrun.sqlite
      --config /freqtrade/user_data/config.json
      --strategy VnSmartTrendStrategy

  research:
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    entrypoint: ["python", "/freqtrade/user_data/research/run.py"]
    command: ["--config", "/freqtrade/user_data/config.json", "--loop", "300"]
    volumes:
      - "./user_data:/freqtrade/user_data"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
